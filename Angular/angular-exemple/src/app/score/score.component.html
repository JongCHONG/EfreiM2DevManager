<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <div class="max-w-2xl w-full bg-white rounded-lg shadow-md p-6 text-center">
    <h1 class="text-3xl font-bold text-blue-600">Résultat du Quiz</h1>
    <p class="mt-4 text-xl">
      Votre score est : <strong>{{ score }}</strong> / 5
    </p>
    <button
      (click)="restart()"
      class="mt-6 inline-block bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700"
    >
      Refaire le Quiz
    </button>
  </div>
</div>
